name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: amagi_cbhs_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/amagi_cbhs_ci
      PAYLOAD_SECRET: ci-dummy-secret-placeholder-32chars
      S3_BUCKET: ci-bucket
      S3_ENDPOINT: https://s3.example.com
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: ci_key_id
      S3_SECRET_ACCESS_KEY: ci_secret_key
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Migrate
        run: pnpm payload migrate

      - name: Test (integration)
        run: pnpm test:int

      - name: Build
        run: pnpm build
